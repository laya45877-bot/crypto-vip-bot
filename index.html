<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto AI Signal Pro (Free Version)</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 400px;
            margin: auto;
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        h2 { color: #38bdf8; }
        .btn {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
        }
        .btn:hover { background-color: #1d4ed8; }
        .signal-box {
            background: #334155;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🚀 Crypto AI Signal Pro</h2>
        <p>Free User များအတွက် အထူးဆော့ဖ်ဝဲ</p>
        
        <p>Signal များ ကြည့်ရှုရန် အောက်ပါခလုတ်ကို နှိပ်ပါ (သို့) ကြော်ငြာကြည့်ပါ</p>
        
        <button class="btn" onclick="watchAdForSignal()">📊 Signal ကြည့်ရန် (ကြော်ငြာကြည့်မည်)</button>

        <div id="signalResult" class="signal-box">
            <h3>📈 Signal အချက်အလက်</h3>
            <p>Coin: BTC/USDT</p>
            <p>Action: LONG (BUY)</p>
            <p>Entry: $67,500</p>
            <p>Target: $69,000</p>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        function watchAdForSignal() {
            // ဤနေရာတွင် Adsagram (သို့) ကြော်ငြာစနစ် ကုဒ် ထည့်သွင်းနိုင်သည်
            alert("ကြော်ငြာကြည့်ရှုပြီးပါပြီ။ Signal ကို ဖွင့်ပေးလိုက်ပါပြီ!");
            document.getElementById("signalResult").style.display = "block";
        }
    </script>

</body>
</html>
